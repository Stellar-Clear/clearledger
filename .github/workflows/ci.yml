name: CI Build & Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-markdown-links:
    name: Check Internal Markdown Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run link checker self-test
        run: node scripts/check-md-links.mjs --self-test

      - name: Check internal Markdown links
        run: node scripts/check-md-links.mjs

  verify-frontend-and-sdk:
    name: Verify TypeScript Frontend & SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check translation catalogs
        run: |
          pnpm --filter web test:translations
          pnpm --filter web check:translations

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit npm dependencies
        # pnpm-workspace.yaml's auditConfig.ignoreGhsas lists the specific,
        # already-triaged advisories this ignores (next 14->15 and toml 3->4,
        # both needing a major-version bump, not a patch override) and why.
        # Any new high/critical advisory not on that list fails the build.
        run: pnpm audit --audit-level=high

      - name: Build Packages (SDK & Web App)
        run: pnpm build
        env:
          NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CABGWVIZFF62FG67ZGFEP67NEEY4WYTMFURDMFTKKNRDAFPKPOJDTN4C
          NEXT_PUBLIC_INVOICE_CONTRACT_ID: CA4O3MR7LWHRSUDBNU6FY6UDFFYBN7TGBZXBDZB4OYYXFYXIFJ6RJF6B
          NEXT_PUBLIC_POOL_CONTRACT_ID: CAKEWH7SJCXGV2MH2WZYIX3QDPTSSBQFXYVYBOWAGLNBBZMPLE2US6CS
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CAJWGUKDTTC3SKN4RAAY72J4DVIIYSCFHX6GIMNTT22ABMISJK4GBCEH

      - name: Check SDK build artifacts
        run: pnpm check:sdk-artifacts

      - name: Run Unit Tests
        run: pnpm test

      - name: Test workspace scripts
        run: pnpm test:scripts

      - name: Lint SDK
        run: pnpm --filter @clearledger/sdk lint
      - name: SDK coverage (with thresholds)
        run: pnpm --filter @clearledger/sdk test:coverage

      - name: Upload SDK coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-coverage-report
          path: |
            packages/sdk/coverage
            packages/sdk/coverage/lcov.info
          if-no-files-found: warn

      - name: Lint Web Application
        run: pnpm --filter web lint

      - name: Check Formatting
        run: npx prettier --check .

  verify-go-indexer:
    name: Verify Go Indexer & API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clearledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Get Dependencies
        run: |
          cd indexer
          go mod download

      - name: Compile Go Services
        run: |
          cd indexer
          go build -v ./...

      - name: Test Go Services
        run: |
          cd indexer
          go test -race -v -coverprofile=coverage.out ./...
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clearledger_test?sslmode=disable
          INDEXER_MIGRATIONS_DIR: ${{ github.workspace }}/indexer/db/migrations

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
          install-mode: goinstall
          working-directory: indexer
          args: --timeout=5m

      - name: Enforce indexer/db coverage threshold
        run: |
          cd indexer
          go test -covermode=atomic -coverprofile=db-coverage.out ./db/... \
            | tee /dev/stderr \
            | grep -oE 'coverage: [0-9.]+% of statements' \
            | grep -oE '[0-9.]+' \
            > /tmp/db_coverage_pct.txt
          pct=$(cat /tmp/db_coverage_pct.txt)
          echo "indexer/db statement coverage: ${pct}%"
          awk -v pct="$pct" 'BEGIN { exit !(pct >= 70) }' \
            || (echo "indexer/db coverage ${pct}% is below the required 70% threshold" && exit 1)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clearledger_test?sslmode=disable
          INDEXER_MIGRATIONS_DIR: ${{ github.workspace }}/indexer/db/migrations

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd indexer
          govulncheck ./...

      - name: Lint Go Services
        run: |
          cd indexer
          go vet ./...

      - name: Check Go Formatting
        run: |
          cd indexer
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi
