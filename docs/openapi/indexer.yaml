openapi: 3.0.3
info:
  title: ClearLedger Indexer API
  version: 1.0.0
  description: |
    Structured API documentation for the ClearLedger Go indexer/API service.

    ## SEP-10 authentication flow

    1. The frontend calls `GET /auth?address=<stellar_public_key>` to request an authentication challenge.
    2. The client signs the returned SEP-10 challenge transaction with Freighter or another Stellar wallet.
    3. The client sends the signed challenge to `POST /auth`.
    4. The indexer validates the signed challenge and returns a JWT.
    5. Protected endpoints use `Authorization: Bearer <jwt>`.

servers:
  - url: http://localhost:8080
    description: Local development
  - url: http://localhost:8080
    description: Production

tags:
  - name: Health
  - name: Auth
  - name: Invoices
  - name: Stats
  - name: Pool
  - name: Events

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: API is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
        "503":
          description: Service degraded (listener or database unavailable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  error:
                    type: string
              examples:
                degraded:
                  value:
                    status: degraded
                    error: listener or database unavailable

  /auth:
    get:
      tags: [Auth]
      summary: Create SEP-10 challenge
      description: Returns a SEP-10 challenge transaction for the supplied Stellar account.
      security: []
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
          example: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF
      responses:
        "200":
          description: Challenge transaction generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChallengeResponse"
              examples:
                challenge:
                  value:
                    transaction: AAAAAgAAA...
                    network_passphrase: Test SDF Network ; September 2015
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      tags: [Auth]
      summary: Exchange signed SEP-10 challenge for JWT
      description: Validates the signed challenge transaction and returns a bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
            examples:
              signedChallenge:
                value:
                  transaction: AAAAAgAAA...signed...
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
              examples:
                token:
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    expires_in: 86400
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /events:
    get:
      tags: [Events]
      summary: List indexed Soroban events
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Indexed events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventLog"
        "429":
          $ref: "#/components/responses/RateLimited"

  /invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      security: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Created, Listed, Funded, Active, Confirmed, Repaid, Defaulted]
        - name: issuer
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedInvoices"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [Invoices]
      summary: Create invoice
      description: Creates an off-chain/indexed invoice record. Requires JWT from the SEP-10 auth flow.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
            examples:
              invoice:
                value:
                  buyer: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF
                  face_value: "10000000000"
                  due_date: 1790000000
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvoiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"

  /invoices/{id}:
    get:
      tags: [Invoices]
      summary: Get invoice by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: a3f8c1d27e904b6a8d5f0139c2e7ab64f0d8c3b19a6e52f7b4c0d91e8a2735bc
      responses:
        "200":
          description: Invoice found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          $ref: "#/components/responses/NotFound"

  /stats:
    get:
      tags: [Stats]
      summary: Protocol statistics
      security: []
      responses:
        "200":
          description: Protocol aggregate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolStats"
        "429":
          $ref: "#/components/responses/RateLimited"

  /pool/stats:
    get:
      tags: [Pool]
      summary: Liquidity pool statistics
      security: []
      responses:
        "200":
          description: Pool aggregate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolStats"
        "429":
          $ref: "#/components/responses/RateLimited"

  /pool/position/{address}:
    get:
      tags: [Pool]
      summary: LP position by address
      security: []
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
          example: GLPAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        "200":
          description: LP position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LPPosition"
        "404":
          $ref: "#/components/responses/NotFound"

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: Exposes Prometheus-format metrics for the indexer service.
      security: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  /pool/snapshots:
    get:
      tags: [Pool]
      summary: Historical pool snapshots
      description: Returns historical liquidity pool snapshots used for charts and trend analysis.
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
          description: Maximum number of snapshots to return
      responses:
        "200":
          description: Pool snapshots ordered by time (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PoolSnapshot"

  /webhooks:
    post:
      tags: [Webhooks]
      summary: Create webhook subscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                event_types:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Webhook created
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of webhooks
  /webhooks/{id}:
    delete:
      tags: [Webhooks]
      summary: Delete webhook subscription
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Webhook deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Bad request
      content:
        text/plain:
          schema:
            type: string
    UnprocessableEntity:
      description: >-
        A field is well-formed but carries the wrong Stellar StrKey version,
        such as a contract (C...) address where an account (G...) is required.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Unauthorized
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Resource not found
      content:
        text/plain:
          schema:
            type: string
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        text/plain:
          schema:
            type: string

  schemas:
    Error:
      description: Plain-text error message (handlers use http.Error)
      type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]

    AuthChallengeResponse:
      type: object
      properties:
        transaction:
          type: string
        network_passphrase:
          type: string
      required: [transaction, network_passphrase]

    AuthRequest:
      type: object
      properties:
        transaction:
          type: string
      required: [transaction]

    AuthTokenResponse:
      type: object
      properties:
        token:
          type: string
        expires_in:
          type: integer
      required: [token, expires_in]

    CreateInvoiceRequest:
      type: object
      properties:
        buyer:
          type: string
          description: >-
            Stellar account address (G...) of the buyer. Must be a valid
            StrKey-encoded account; a malformed address (including a bad
            checksum) returns 400 and a wrong-version StrKey such as a contract
            (C...) address returns 422. The authenticated issuer must likewise
            be an account (G...) StrKey.
          example: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF
        face_value:
          type: string
          description: >-
            Decimal string of the invoice face value in stroops. Must be
            strictly positive and at most 2^128 - 1
            (340282366920938463463374607431768211455); at most 40 digits.
        due_date:
          type: integer
          format: int64
          description: >-
            Unix timestamp in seconds. Must be in the future and no more than
            5 years from the time the request is validated.
      required: [buyer, face_value, due_date]

    CreateInvoiceResponse:
      type: object
      properties:
        invoice_id:
          type: string
          description: Hexadecimal BytesN<32> invoice identifier.
        transaction_hash:
          type: string
          description: Base64-encoded transaction hash.
        status:
          type: string
          description: Transaction status (e.g. SUCCESS).
      required: [invoice_id, transaction_hash, status]

    Invoice:
      type: object
      properties:
        id:
          type: string
          description: Hexadecimal BytesN<32> invoice identifier.
          pattern: "^[0-9a-fA-F]{64}$"
        issuer:
          type: string
        buyer:
          type: string
        face_value:
          type: string
        discount_bps:
          type: integer
        funded_amount:
          type: string
        due_date:
          type: integer
          format: int64
        status:
          type: string
          enum: [Created, Listed, Funded, Active, Confirmed, Repaid, Defaulted]
        created_at:
          type: integer
          format: int64
        funded_at:
          type: integer
          format: int64
          nullable: true
        shipped_at:
          type: integer
          format: int64
          nullable: true
        issuer_confirmed:
          type: boolean
        buyer_confirmed:
          type: boolean
        buyer_confirmed_at:
          type: integer
          format: int64
          nullable: true
        repaid_at:
          type: integer
          format: int64
          nullable: true
        attestation_agent_id:
          type: string
          nullable: true
        risk_score_bps:
          type: integer
          nullable: true
        evidence_hash:
          type: string
          nullable: true
        attested_at:
          type: integer
          format: int64
          nullable: true
      required: [id, issuer, buyer, face_value, due_date, status]

    PaginatedInvoices:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required: [data, total, page, limit, totalPages]

    EventLog:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: string
        contract_id:
          type: string
        ledger:
          type: integer
        ledger_closed_at:
          type: integer
          format: int64
        event_type:
          type: string
        data:
          type: object
          additionalProperties: true
      required: [id, event_id, contract_id, ledger, ledger_closed_at, event_type, data]

    ProtocolStats:
      type: object
      properties:
        total_usdc_financed:
          type: string
        active_invoice_count:
          type: integer
        total_invoices:
          type: integer
        total_repaid:
          type: integer
        total_defaulted:
          type: integer
        average_yield_bps:
          type: integer
        pool_utilization_bps:
          type: integer
        registered_issuers:
          type: integer

    PoolStats:
      type: object
      properties:
        total_deposits:
          type: string
        total_funded:
          type: string
        available_liquidity:
          type: string
        utilization_rate_bps:
          type: integer
        total_yield_distributed:
          type: string
        active_invoice_count:
          type: integer
        total_shares:
          type: string
        updated_at:
          type: string
          format: date-time

    LPPosition:
      type: object
      properties:
        shares:
          type: string
        usdc_value:
          type: string
        yield_earned:
          type: string
        deposit_count:
          type: integer

    PoolSnapshot:
      type: object
      properties:
        timestamp:
          type: integer
          description: Unix timestamp of the snapshot
        utilizationRateBps:
          type: integer
          description: Pool utilization in basis points
        totalYieldDistributed:
          type: string
          description: Cumulative yield distributed up to this snapshot
